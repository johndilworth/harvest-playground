# Harvest dashboard (separate Netlify site "harvest-dashboard"); never touches the playground's site/.
[build]
  publish = "public"
  functions = "netlify/functions"
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
[[headers]]
  for = "/captures/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Access-Control-Allow-Origin = "*"
[[redirects]]
  from = "/api/trigger"
  to = "/.netlify/functions/trigger"
  status = 200
# Legacy single-project URLs -> Harvest Playground (query string ?c=N is kept by Netlify)
[[redirects]]
  from = "/cycle.html"
  to = "/p/harvest-playground/cycle.html"
  status = 301
  force = true
[[redirects]]
  from = "/summary.html"
  to = "/p/harvest-playground/summary.html"
  status = 301
  force = true
[[redirects]]
  from = "/harvest.json"
  to = "/data/harvest-playground.json"
  status = 301
  force = true
# Per-project pages (one set of templates, slug read from the path)
[[redirects]]
  from = "/p/:slug/"
  to = "/project.html"
  status = 200
[[redirects]]
  from = "/p/:slug/cycle.html"
  to = "/project-cycle.html"
  status = 200
[[redirects]]
  from = "/p/:slug/summary.html"
  to = "/project-summary.html"
  status = 200
# Old meeting series slug -> team-meeting (query strings kept)
[[redirects]]
  from = "/m/harvest-weekly-sync/*"
  to = "/m/team-meeting/:splat"
  status = 301
  force = true
# Meeting series pages (type "meeting")
[[redirects]]
  from = "/m/:slug/"
  to = "/meeting.html"
  status = 200
[[redirects]]
  from = "/m/:slug/meeting.html"
  to = "/meeting-page.html"
  status = 200
# Old per-series summary page -> individual meeting page (query ?m=ID kept)
[[redirects]]
  from = "/m/:slug/summary.html"
  to = "/m/:slug/meeting.html"
  status = 301
  force = true
